        /* 全域背景圖片容器 */
        #global-bg {
            position: fixed;

            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;

            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        #global-bg .fallback-gradient {

            inset: 0;
            background: var(--bg-gradient);
            z-index: -2;

        .serif-font {
            font-family: 'Noto Serif TC', serif;

        /* 卡片基礎樣式 */
        .chapter-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background-color: white;
            border: 1px solid rgba(255,255,255,0.6);

        .chapter-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            border-color: var(--color-kiku-blue);
            z-index: 10;
        }

        /* 圖片容器 */
        .card-image-container {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            border-radius: 0.75rem;
            opacity: 0;
            transition: opacity 0.3s ease;
            background-color: #2d2a32; /* 深色背景 */
        }

        .card-image-container img {
            width: 100%;
            height: 100%;
            object-fit: contain; 
            object-position: center;
            /* 移除原本的 transition，改用 animation 控制 */
            will-change: transform; 
        }

        /* 定義緩慢放大動畫：3秒內從 1.0 放大到 1.15 */
        @keyframes slowZoom {
            0% { transform: scale(1.0); }
            100% { transform: scale(1.15); }
        }

        /* 動畫類別 */
        .zoom-animate {
            animation: slowZoom 3s linear forwards;
        }

        /* 當有圖片時的樣式修正 */
        .has-image .card-content {
            background: none !important;
        }
        
        .has-image .chapter-num {
            color: rgba(255,255,255,0.95) !important;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const cards = document.querySelectorAll('.chapter-card');
            
            cards.forEach(card => {
                const chapter = card.getAttribute('data-chapter');
                const imgContainer = card.querySelector('.card-image-container');
                const img = imgContainer.querySelector('img');
                let imageInterval;
                let currentImageIndex = 1;
                const maxImages = 10;

                // 初始化：嘗試載入第一張圖片
                const initialSrc = `images/${chapter}-1.jpg`;
                img.src = initialSrc;

                img.onload = function() {
                    imgContainer.style.opacity = '1';
                    card.classList.add('has-image');
                };

                img.onerror = function() {
                    if (currentImageIndex > 1) {
                        currentImageIndex = 1;
                        this.src = `images/${chapter}-1.jpg`;
                    } else {
                        imgContainer.style.opacity = '0';
                        card.classList.remove('has-image');
                    }
                };

                // 滑鼠懸停事件
                card.addEventListener('mouseenter', () => {
                    if (card.classList.contains('has-image')) {
                        // 1. 立即為當前圖片添加動畫
                        img.classList.add('zoom-animate');

                        if(imageInterval) clearInterval(imageInterval);
                        
                        imageInterval = setInterval(() => {
                            // 2. 在切換圖片前，先移除動畫 class 並強制重繪 (Reflow)
                            // 這樣做是為了讓 CSS 動畫能被重置，而不是一直停留在 100% 狀態
                            img.classList.remove('zoom-animate');
                            void img.offsetWidth; // 觸發重繪

                            // 3. 切換圖片索引
                            currentImageIndex++;
                            if (currentImageIndex > maxImages) {
                                currentImageIndex = 1;
                            }
                            img.src = `images/${chapter}-${currentImageIndex}.jpg`;
                            
                            // 4. 重新添加動畫 class，讓新圖片從 1.0 開始放大
                            img.classList.add('zoom-animate');

                        }, 3000); // 3秒切換一次
                    }
                });

                // 滑鼠離開事件
                card.addEventListener('mouseleave', () => {
                    if (imageInterval) {
                        clearInterval(imageInterval);
                        imageInterval = null;
                    }
                    // 移除動畫 class
                    img.classList.remove('zoom-animate');
                    
                    // 重置回第一張
                    currentImageIndex = 1;
                    if (card.classList.contains('has-image')) {
                        img.src = `images/${chapter}-1.jpg`;
                    }
                });
            });
        });
    </script>
